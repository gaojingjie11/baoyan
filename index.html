<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>2027 计算机预推免追踪</title>
  <meta name="description" content="985 / 211 高校计算机及软件方向预推免时间、状态与个人申请进度追踪">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 登录遮罩 -->
  <div id="login" class="login-overlay" hidden>
    <form id="login-form" class="login-card">
      <h2>登录追踪器</h2>
      <p class="login-sub">进度按账号隔离，手机 / 电脑同一账号自动同步</p>
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="login-btn">登录</button>
      <div id="login-err" class="login-err"></div>
    </form>
  </div>

  <header class="hero">
    <div class="wrap">
      <div class="userbar" id="userbar" hidden>
        <span class="uname">👤 <b id="user-name"></b></span>
        <label class="theme-label">主题
          <select id="theme" aria-label="主题">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <button id="btn-logout" class="logout-btn">退出</button>
      </div>
      <div class="eyebrow">2027 推免申请 · 我的追踪器</div>
      <h1>计算机预推免追踪</h1>
      <p>985 优先 · 211 随后 · 软件工程 / 计算机 / 网安 方向</p>
      <div class="updated" id="updated">正在加载数据…</div>
    </div>
  </header>

  <main class="wrap">
    <!-- 我的进度 + 官方紧急度 统计（可点击筛选） -->
    <section class="stats" id="stats"></section>

    <!-- 进度同步：导出/导入（跨设备共享，无需后端） -->
    <section class="syncbar">
      <span class="sync-tip">进度仅存本设备 · 换设备前先「导出」，到新设备「导入」</span>
      <div class="sync-btns">
        <button id="btn-export" class="sync-btn">⬇ 导出进度</button>
        <button id="btn-import" class="sync-btn">⬆ 导入进度</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
      </div>
    </section>

    <!-- 今日关注：即将截止 / 正在报名 / 我的进行中 -->
    <section class="focus" id="focus"></section>

    <!-- 工具栏：搜索 + 多维筛选 -->
    <section class="toolbar">
      <input id="search" type="search" placeholder="搜索学校、学院或方向…" autocomplete="off">

      <div class="fgroup">
        <span class="flabel">层次</span>
        <div class="chips">
          <button class="chip active" data-group="type" data-value="all">全部</button>
          <button class="chip" data-group="type" data-value="985">985</button>
          <button class="chip" data-group="type" data-value="211">211</button>
        </div>
      </div>

      <div class="fgroup">
        <span class="flabel">方向</span>
        <div class="chips">
          <button class="chip active" data-group="dir" data-value="all">全部</button>
          <button class="chip" data-group="dir" data-value="软件工程">软件工程</button>
          <button class="chip" data-group="dir" data-value="计算机">计算机</button>
          <button class="chip" data-group="dir" data-value="网安">网安</button>
          <button class="chip" data-group="dir" data-value="其他">其他</button>
        </div>
      </div>

      <div class="fgroup">
        <span class="flabel">我的进度</span>
        <div class="chips">
          <button class="chip active" data-group="prog" data-value="all">全部</button>
          <button class="chip" data-group="prog" data-value="none">未报名</button>
          <button class="chip" data-group="prog" data-value="applied">已报名</button>
          <button class="chip" data-group="prog" data-value="iv">待复试</button>
          <button class="chip" data-group="prog" data-value="adw">待录取</button>
          <button class="chip" data-group="prog" data-value="adm">已录取</button>
          <button class="chip" data-group="prog" data-value="failed">已失败</button>
        </div>
      </div>

      <div class="fgroup">
        <span class="flabel">报名状态</span>
        <div class="chips">
          <button class="chip active" data-group="status" data-value="all">全部</button>
          <button class="chip" data-group="status" data-value="open">报名中</button>
          <button class="chip" data-group="status" data-value="soon">7天内截止</button>
          <button class="chip" data-group="status" data-value="待发布">待发布</button>
          <button class="chip danger" data-group="status" data-value="已截止">已截止</button>
        </div>
      </div>

      <div class="fgroup reset-row">
        <button id="btn-reset-filters" class="reset-btn" type="button">↺ 重置所有筛选</button>
      </div>
    </section>

    <section class="legend">
      <span><i class="dot open"></i>报名中</span>
      <span><i class="dot soon"></i>7天内截止</span>
      <span><i class="dot closed"></i>已截止</span>
      <span><i class="dot pending"></i>待发布</span>
    </section>

    <section id="reminder" class="reminder" hidden></section>

    <section id="list" class="cards"></section>
    <div id="empty" class="empty" hidden>没有匹配结果</div>
  </main>

  <footer class="wrap footer">
    登录后进度按账号同步；时间与政策以高校官方通知为准。
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
