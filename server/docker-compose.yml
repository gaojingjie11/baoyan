services:
  api:
    build: .
    # 数据库用你自己已有的 Postgres（见 .env 里的 DATABASE_URL），不再内置 db 容器
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      CORS_ORIGIN: "https://baoyan-one.vercel.app"
      API_TOKEN: "${API_TOKEN:-}"
    ports:
      - "2026:8080"
    restart: unless-stopped
