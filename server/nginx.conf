# 保研追踪器 · Nginx 站点配置（同源部署，免域名 / 免 HTTPS）
#
# 用法：
#   1) 安装： sudo apt install nginx
#   2) 把本文件放到 /etc/nginx/conf.d/baoyan.conf
#      （若 /etc/nginx/sites-enabled/default 存在，请删掉避免冲突）
#   3) 把前端静态文件放到下面 root 指定的目录（默认 /var/www/baoyan）
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) 后端容器已在宿主机映射 2026；本配置把 /api/ 反代到 localhost:2026
#
# 说明：前端(/) 与后端(/api) 同一来源 http://服务器IP，
#       因此无跨域、无混合内容，不用域名、不用证书。
#       以后若想上 HTTPS/域名，再额外加一个 listen 443 ssl 的 server 块并用 certbot 签证书即可。

server {
    listen 80 default_server;
    server_name _;

    root /var/www/baoyan;
    index index.html;

    # 前端静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：/api/* 转发到 Go 后端容器（宿主机 2026）
    location /api/ {
        proxy_pass http://localhost:2026;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
