name: Deploy frontend + backend

# 推送 main 时：① rsync 前端到服务器 /var/www/baoyan；② SSH 到服务器 git pull + 重建后端容器。
# 前置：GitHub 仓库 Settings → Secrets 添加
#   SERVER_HOST   = 42.193.104.173
#   SERVER_USER   = 你的 SSH 用户名（如 root）
#   SSH_PRIVATE_KEY = 部署私钥（公钥已写入服务器 ~/.ssh/authorized_keys）
# 服务器需已跑过一次 server/setup.sh（克隆仓库到 /opt/baoyan 并起过后端）。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'config.js'
      - 'styles.css'
      - 'schools.json'
      - 'vercel.json'
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: rsync 前端到服务器
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DEST: /var/www/baoyan
        run: |
          rsync -avz --delete \
            --exclude='.git' --exclude='server' --exclude='.github' \
            ./ "$USER@$HOST:$DEST/"

      - name: 服务器端拉代码并重建后端
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$USER@$HOST" 'set -e; cd /opt/baoyan && git pull --ff-only && cd server && docker compose up -d --build'
