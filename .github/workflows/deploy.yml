name: Deploy server application

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'config.js'
      - 'styles.css'
      - 'schools.json'
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Stamp cache buster and sync to server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e
          # 用当前 commit 短 hash 作为静态资源版本戳，确保每次部署后浏览器重新加载 JS/CSS
          CACHE_TAG="${GITHUB_SHA:0:7}"
          sed -i.bak \
            -e "s|src=\"app\.js\"|src=\"app.js?v=${CACHE_TAG}\"|g" \
            -e "s|src=\"config\.js\"|src=\"config.js?v=${CACHE_TAG}\"|g" \
            -e "s|href=\"styles\.css\"|href=\"styles.css?v=${CACHE_TAG}\"|g" \
            index.html
          rm -f index.html.bak
          # 直接从 GitHub Actions 已 checkout 的代码同步到服务器，避免依赖服务器本地 git 状态
          rsync -avz --delete --exclude=.git --exclude=.github ./ "$USER@$HOST:/opt/baoyan/"

      - name: Deploy checked-out main branch
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh "$USER@$HOST" 'sudo /opt/baoyan/server/deploy.sh'
